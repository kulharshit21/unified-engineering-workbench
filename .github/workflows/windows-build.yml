name: Windows 11 MSVC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja Build Tool
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Install Qt 6.8.2 (MSVC 2022 x64)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Configure CMake (Release)
      shell: pwsh
      run: |
        cmake -B build/Release -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
          -DCMAKE_CXX_STANDARD=17

    - name: Build All Targets (WorkbenchCore, WorkbenchApp, Launch, Tests)
      shell: pwsh
      run: |
        cmake --build build/Release --config Release

    - name: Run Automated CTest Suite
      shell: pwsh
      run: |
        cd build/Release
        ctest --output-on-failure -C Release

    - name: Verify Built Executables Presence
      shell: pwsh
      run: |
        $launchPath = "build/Release/bin/Launch.exe"
        $appPath = "build/Release/bin/WorkbenchApp.exe"
        if (-not (Test-Path $launchPath)) {
            throw "CRITICAL FAILURE: Launch.exe missing at $launchPath"
        }
        if (-not (Test-Path $appPath)) {
            throw "CRITICAL FAILURE: WorkbenchApp.exe missing at $appPath"
        }
        $launchSize = (Get-Item $launchPath).Length
        $appSize = (Get-Item $appPath).Length
        Write-Host "[VERIFIED] Found Launch.exe ($launchSize bytes) and WorkbenchApp.exe ($appSize bytes)."
